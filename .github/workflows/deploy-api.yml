name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '!server/VintyDev.ContactFunction/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vinty-api:${{ github.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run EF Core migrations
        working-directory: ./server
        env: 
            Client__Origin: https://vinty.dev
        run: |
            dotnet tool install --global dotnet-ef --version 10.0.10
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet restore
            CONNECTION_STRING=$(az containerapp secret show \
                --name vinty-api \
                --resource-group vinty-dev-rg \
                --secret-name sql-connection \
                --query value -o tsv)
            ConnectionStrings__DefaultConnection="$CONNECTION_STRING" dotnet ef database update
      - name: Deploy to Container Apps
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name vinty-api \
              --resource-group vinty-dev-rg \
              --image ghcr.io/${{ github.repository_owner }}/vinty-api:${{ github.sha }}