name: Deploy Contact Function

on:
  push:
    branches: [main]
    paths:
      - 'server/VintyDev.ContactFunction/**'
      - '.github/workflows/deploy-function.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish server/VintyDev.ContactFunction/VintyDev.ContactFunction.csproj -c Release -o ./publish

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: vinty-contact-function
          package: ./publish